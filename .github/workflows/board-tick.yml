name: board-tick

# Manual backstop for the FOMO board + settle. The hourly cadence runs on
# the Cloudflare worker in services/keeper-cron/ (cron 17 * * * *); the
# Vercel cron in apps/web/vercel.json is the daily backstop.
# This workflow's own schedule never fires: scheduled workflows do not
# register on this account (proven 2026-09-11 — file-touch pushes and
# disable/enable did not register it; a fresh probe repo with a */5 cron
# never ran either). Kept for workflow_dispatch only.
# Secret is CRON_SECRET (same value as the Cloudflare binding and Vercel).
# Never a FomoScan key.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: board-tick
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh board and settle
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          TICK_URL: ${{ vars.KEEPER_TICK_URL }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set"
            exit 1
          fi
          : "${TICK_URL:=https://ngmi.markets/api/keeper/tick}"
          curl -fsS --max-time 180 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            "$TICK_URL"
