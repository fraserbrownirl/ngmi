[workspace]
members = [
    "programs/fomo-pnl"
]
resolver = "2"

# Pin crates that require edition2024 / rustc > 1.79 so platform-tools v1.43
# (Solana CLI 2.1.21 + Anchor 0.32) can still resolve the lockfile.
[workspace.dependencies]
blake3 = "=1.8.2"
constant_time_eq = "=0.3.1"
base64ct = "=1.7.3"
indexmap = "=2.11.4"
zeroize = "=1.8.1"
zeroize_derive = "=1.4.2"
unicode-segmentation = "=1.12.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
